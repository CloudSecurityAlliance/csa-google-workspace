version: 2
updates:
  # Keep the SHA-pinned GitHub Actions current (Dependabot updates the pin + comment).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Flag newly-disclosed CVEs / updates in the Python dependency closure.
  #
  # `/requirements` IS DELIBERATELY NOT LISTED, and adding it back will break CI.
  #
  # It was listed from v0.30.8 until 2026-08-28, when the first run proved Dependabot cannot
  # maintain a fully-pinned transitive lock: PR #225 bumped `pydantic-core` 2.46.4 -> 2.48.0 in
  # requirements/dev.txt and left `pydantic==2.13.4`, which pins `pydantic-core==2.46.4`. Every
  # job failed with ResolutionImpossible. Dependabot edits individual pinned lines; a lock has
  # to be RE-RESOLVED as a graph.
  #
  # `.github/workflows/relock.yml` took that job over. Dependabot keeps watching pyproject.toml,
  # which is what it is actually good at - advisories against declared ranges.
  #
  # NOT LISTING IT DID NOT STOP IT. On 2026-09-15, PR #456 arrived editing `requirements/build.in`,
  # `build.txt` and `dev.txt` anyway - "across 1 directory", i.e. Dependabot discovered them on its
  # own. And it was worse than #225: as well as an unsatisfiable `pydantic-core` bump it RESOLVED
  # THE UNIVERSAL LOCK FOR ITS OWN ENVIRONMENT, stripping the environment markers from 17 packages
  # and deleting `colorama ; os_name == 'nt'` and `pywin32-ctypes` outright - two Windows-only
  # dependencies, removed, in the file the release job installs from.
  #
  # So this comment is a statement of intent, not a control. The control is
  # `tests/test_lockfiles.py::TestTheUniversalLockKeepsItsEnvironmentMarkers`, which fails on that
  # exact shape (17 markers -> 0) and fails the same way for a hand-edit. If these PRs keep
  # arriving, the next lever is dropping the `pip` entry entirely - which costs advisory coverage
  # of the pyproject ranges, so it is a trade rather than a fix. Tracked in #467.
  #
  # THIRD OCCURRENCE, 2026-09-28: PR #478 bumped `pydantic-core` 2.46.5 -> 2.49.0 again, and
  # again nothing could install it - `pydantic` 2.13.5 is the newest release on PyPI and pins
  # `pydantic-core==2.46.5`. #467 diagnosed exactly this and predicted the recurrence ("the core
  # is published ahead of its wrapper, as it usually is"), proposed the `ignore` below, and was
  # closed without it. So it happened again, cost another review, and the six *landable* bumps
  # in the same PR were held hostage to the one that could not.
  #
  # The `ignore` is narrow on purpose. Dropping the whole `pip` entry was the other lever and it
  # costs advisory coverage of the pyproject ranges, which is the thing Dependabot is actually
  # good at. Ignoring the specific packages whose version is CHOSEN BY THEIR PARENT keeps the
  # advisories and stops the unsatisfiable PRs. Add to this list when the same shape appears:
  # the tell is a package whose parent pins it with `==`.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    ignore:
      # Pinned exactly by `pydantic`, which ships behind it. A bump here is never installable
      # on its own; `scripts/lock.sh --upgrade` takes it the moment a pydantic release admits it.
      - dependency-name: "pydantic-core"
