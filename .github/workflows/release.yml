name: release

# Publishes to PyPI when a GitHub Release is published, via PyPI Trusted Publishing
# (OIDC, no stored token) with PEP 740 attestations. One-time setup + per-release steps:
# RELEASING.md. Actions are pinned to commit SHAs (Dependabot keeps them current).
#
# TWO JOBS, AND THE SPLIT IS THE POINT (#186). `build` runs every piece of third-party code
# involved in a release - pip resolving lower-bound-only ranges, pip-audit, bandit, the test
# suite, the build backend - and holds NO credential. `publish` holds `id-token: write` and
# runs exactly one action against artifacts it downloads; no project code, no test code and no
# dependency of ours executes in it.
#
# Before the split, all of that ran in the job that could mint a PyPI-audience OIDC token: any
# compromised dependency could read ACTIONS_ID_TOKEN_REQUEST_URL/_TOKEN from the environment
# and publish arbitrary artifacts as `csa-google-workspace`. That is amplification rather than
# a vulnerability of ours - it needs a compromised dependency first - but it turns "a
# dependency was compromised" into "our published artifact was compromised", which lands on
# every operator holding a full-Drive token.
#
# The `pypi` environment gate moves to `publish` with the credential, which also improves the
# approval: it now happens AFTER the suite and the sdist guard have passed, so a reviewer is
# approving a build they can see succeeded rather than one about to start.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # No `id-token` here, deliberately and load-bearingly: everything below executes
    # third-party code, and none of it can mint a publishing credential that does not exist.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history and tags, for the same reason `tests.yml` needs them: the suite this
          # job runs includes guards that READ git - the audit coverage table sizes each file
          # as it was at the audit that covered it, and the changelog is reconciled against
          # the tags. Depth 1 has neither, and a release must not be gated by a suite whose
          # guards cannot see what they check.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      # The controls this release depends on are configured in GitHub and PyPI, not here, so
      # they are checked at the moment they matter rather than only on the weekly schedule.
      # A REMOVED REVIEWER would otherwise let this very run publish unattended.
      #
      # Safe to put on the release path because the script degrades correctly: an outage or a
      # token without rights is UNVERIFIABLE and exits 0, and only an actually-violated
      # control exits non-zero. It cannot redden a release for being unable to reach GitHub.
      - name: Assert the externally-enforced controls
        run: python scripts/check_controls.py

      # Deliberately NOT hash-pinned: pip-audit's job is to observe what a real install of
      # this package resolves to. Auditing our own lockfile would be auditing the one
      # environment nobody installs. See requirements/README.md.
      - name: Security gate (pip-audit + bandit, unpinned runtime closure on purpose)
        run: |
          pip install -e . pip-audit bandit
          pip-audit --skip-editable
          bandit -r src
      # From here everything is hash-pinned, because from here the steps produce the artifact.
      # The suite that gates the tag and the toolchain that writes the wheel both run against
      # a closure recorded in this repository rather than whatever PyPI resolves today.
      - name: Unit suite (never publish a red tag)
        # `--no-build-isolation` with the backend installed from the pinned file: otherwise
        # the editable install fetches setuptools from PyPI unpinned. PIP_CONSTRAINT would be
        # the obvious tool and cannot be used here - a hashed constraints file puts pip in
        # hash-checking mode, and an editable install then fails with "no single file to hash".
        run: |
          pip install --require-hashes -r requirements/dev.txt
          pip install --require-hashes -r requirements/build-backend.txt
          pip install -e . --no-deps --no-build-isolation
          pytest -q
      # PIP_CONSTRAINT is the load-bearing half. `python -m build` creates its OWN isolated
      # venv and installs `build-system.requires` (setuptools) into it straight from PyPI, so
      # pinning `build` and `twine` here reaches everything EXCEPT the code that actually
      # writes the wheel. Verified by falsification: with a constraint contradicting
      # build-system.requires the build fails with a resolver conflict, so this is applied
      # rather than silently ignored.
      - name: Build sdist + wheel (build backend pinned through the isolated env)
        env:
          PIP_CONSTRAINT: requirements/build-backend.txt
        run: |
          pip install --require-hashes -r requirements/build.txt
          python -m build
      - name: Check metadata + guard dist contents
        run: |
          twine check dist/*
          # fail loudly if a probe transcript / secret / research or experiments file
          # ever sneaks into the sdist.
          #
          # `.py` files are excluded from the word match, and only from the word match. The
          # pattern is a SUBSTRING test on paths, so a legitimately-named source file trips it:
          # tests/test_read_only_means_a_read_only_token.py blocked the v0.30.2 security release
          # for containing the word "token". The guard failed closed, which is right, but a
          # false positive that only appears at publish time ambushes the release it is meant to
          # protect.
          #
          # What this costs: nothing this check ever provided. It matches FILENAMES, never
          # contents, so a secret hardcoded in a .py was invisible to it before and still is -
          # that is bandit's and gitleaks' job. Real credentials are .json/.txt/.pem, and every
          # one of them is still caught. Verified against token.json, credentials.json,
          # client_secret_*.json, token_full.json, a probe transcript, research/ and
          # experiments/ - all six still flagged.
          #
          # tests/test_sdist_guard.py runs this same pattern over the tracked tree, so a
          # colliding filename fails on the PR that adds it rather than during a release.
          if tar tzf dist/*.tar.gz | grep -Ev '\.py$' \
               | grep -Ei '(^|/)(research|experiments)/|token|credential|client_secret'; then
            echo "::error::unexpected file in sdist — refusing to publish"; exit 1
          fi
      - name: Upload the built distributions for the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error      # an empty publish would otherwise look like a success
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi          # protected environment — gates the publish behind approval
    permissions:
      id-token: write          # required for Trusted Publishing (OIDC) + attestations
    # Deliberately minimal: download the artifacts and hand them to the PyPA action. No
    # checkout, so project code is not even present in the job that holds the credential -
    # which is the whole property this split buys. Adding a step here that runs anything of
    # ours, or installs anything, gives that property back.
    steps:
      - name: Download the distributions built above
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI (Trusted Publishing + PEP 740 attestations)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          attestations: true
