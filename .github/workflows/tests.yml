name: tests

# Runs the offline unit suite (FakeBackend — no network, no Google credentials) on
# every push to main and every PR, plus lint + type-check. The live Google suite in
# tests/integration/ stays gated behind CSA_GW_INTEGRATION and is intentionally NOT run.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history, because two guards read it. `gen_audit_index.py` sizes each file AS
          # IT WAS at the audit that covered it (#322), and `check_release_history.py`
          # reconciles this file against the tags. The default depth-1 checkout has neither,
          # and both degrade QUIETLY - a line share silently vanishes, so the strongest claim
          # in the coverage table would never actually be verified in CI.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Install package + dev deps (hash-pinned)
        # Three lines, and each one is the way it is for a reason:
        #
        # 1. `--require-hashes` is all-or-nothing, so the project cannot go in with the
        #    closure - hence the separate editable install with `--no-deps`.
        # 2. `pip install -e .` builds through PEP 517 and would fetch the backend from PyPI
        #    unpinned, so setuptools is installed from the same pinned file the release uses
        #    and `--no-build-isolation` makes the build use it.
        # 3. `PIP_CONSTRAINT` is NOT used here even though it is the obvious tool: a
        #    constraints file carrying hashes puts pip in hash-checking mode for the whole
        #    invocation, and an editable install then fails outright with "no single file to
        #    hash". Measured, not assumed.
        #
        # No `pip install --upgrade pip` anywhere in this file: that was an unpinned fetch
        # from PyPI by the tool about to verify every other hash. The runner's pip is used
        # as shipped.
        run: |
          pip install --require-hashes -r requirements/dev.txt
          pip install --require-hashes -r requirements/build-backend.txt
          pip install -e . --no-deps --no-build-isolation
      - name: Lint (ruff)
        run: ruff check src tests
      - name: Type-check (mypy)
        run: mypy
      # Reconciles CHANGELOG headings against git tags and PyPI. Caught v0.27.0, which the
      # changelog claimed was released and which had never been published - a gap no test could
      # see, because the discrepancy is between this repo and the outside world. The script
      # treats an unreachable PyPI as "skip that comparison", not as a failure, so a PyPI
      # outage cannot redden an unrelated PR.
      - name: Reconcile changelog, tags and PyPI
        run: python scripts/check_release_history.py
      # The audit index's tables are generated from per-audit front matter, and its coverage
      # claim is computed against the tracked tree. Checked rather than trusted because a
      # stale one does not merely look untidy: it says an audit covered code it never saw.
      - name: Audit index is current
        run: python scripts/gen_audit_index.py --check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One row, because `requires-python = ">=3.14"` makes the others uninstallable -
        # a matrix entry that cannot install is not coverage, it is a red job. This is the
        # cost of the floor being a POLICY choice rather than a technical one: the versions
        # this code still runs on are no longer tested, because it is no longer offered to
        # them. Widen it again the moment the floor comes back down.
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history, because two guards read it. `gen_audit_index.py` sizes each file AS
          # IT WAS at the audit that covered it (#322), and `check_release_history.py`
          # reconciles this file against the tags. The default depth-1 checkout has neither,
          # and both degrade QUIETLY - a line share silently vanishes, so the strongest claim
          # in the coverage table would never actually be verified in CI.
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev deps (hash-pinned)
        # Three lines, and each one is the way it is for a reason:
        #
        # 1. `--require-hashes` is all-or-nothing, so the project cannot go in with the
        #    closure - hence the separate editable install with `--no-deps`.
        # 2. `pip install -e .` builds through PEP 517 and would fetch the backend from PyPI
        #    unpinned, so setuptools is installed from the same pinned file the release uses
        #    and `--no-build-isolation` makes the build use it.
        # 3. `PIP_CONSTRAINT` is NOT used here even though it is the obvious tool: a
        #    constraints file carrying hashes puts pip in hash-checking mode for the whole
        #    invocation, and an editable install then fails outright with "no single file to
        #    hash". Measured, not assumed.
        #
        # No `pip install --upgrade pip` anywhere in this file: that was an unpinned fetch
        # from PyPI by the tool about to verify every other hash. The runner's pip is used
        # as shipped.
        run: |
          pip install --require-hashes -r requirements/dev.txt
          pip install --require-hashes -r requirements/build-backend.txt
          pip install -e . --no-deps --no-build-isolation
      - name: Run unit suite + coverage (fail_under gate from pyproject)
        run: pytest -q --cov --cov-report=term-missing

  test-windows:
    name: the suite on Windows
    runs-on: windows-latest
    # Required, and deliberately not `continue-on-error`. This repo is the one that HAS a
    # Windows rig (`Run-full-test-suite.ps1`), and it still went from 27 Windows failures at
    # v0.53.0 to 2 at v0.55.0 without CI observing either number, because a rig is run when
    # somebody remembers and a job is run every time. A passing ubuntu job is evidence about
    # ubuntu; a job that cannot fail would be evidence about nothing.
    #
    # This is also what unblocks `tests/test_windows_acl.py`, whose own docstring named
    # "adding windows-latest to .github/workflows/tests.yml (#453)" as its precondition. The
    # icacls hardening that replaced T5's POSIX-only mitigations (#452) had never been
    # executed by an automated test on the platform it exists for. Now it is, on every PR.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      # NOT the hash-pinned closure the ubuntu job installs. `requirements/dev.txt` is
      # resolved for one platform, and a Windows run needs wheels that closure was never
      # asked to contain, so `--require-hashes` would fail on the dependency set rather than
      # on anything this job is meant to test. Re-locking for a second platform is a real
      # decision with its own costs (`relock.yml` owns that ground) and is not smuggled in
      # here. Supply-chain pinning stays gated on ubuntu, where it is already enforced.
      - name: Install package + dev deps
        run: pip install -e ".[dev]"
      # NO COVERAGE GATE, and the reason is structural rather than a concession. `auth.py`
      # branches on `_WINDOWS`: an `icacls` ACL reader on one side, `os.stat` mode bits on
      # the other, with the Windows half carrying `# pragma: no cover` because ubuntu is
      # where `fail_under` is enforced and those lines are unreachable there. Each platform
      # necessarily leaves the other's branch unexecuted, so 100% is reachable by the UNION
      # and by neither alone. Gating coverage twice would mean a second, lower number, which
      # is the thing TESTING.md refuses by name. What this job gates is whether the tests
      # pass on Windows - simpler, and still a gate that can fail.
      - name: Run unit suite
        run: pytest -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      # Install the RUNTIME closure only (not [dev]) so pip-audit scans shipped deps,
      # plus the two scanners themselves.
      #
      # DELIBERATELY NOT HASH-PINNED, unlike every other install in this repository's CI.
      # pip-audit exists to observe what a REAL install of this package resolves to; pointing
      # it at requirements/dev.txt would have it audit our own lockfile - the one environment
      # we do not need told about - and a CVE in the version users actually get would stop
      # being reported here. The free resolution IS the signal. See requirements/README.md.
      - name: Install package (runtime deps, unpinned on purpose) + scanners
        run: |
          pip install -e . pip-audit bandit
      - name: Dependency CVE scan (pip-audit)
        run: pip-audit --skip-editable
      - name: Static security analysis (bandit)
        run: bandit -r src

  # RR-004. Every other install here is hash-pinned, which is right and leaves one gap: the
  # `[mcp]` extra is a RANGE (`mcp>=2.1`), and it is the dependency that IS the server. A future
  # SDK release inside that range could break the shipped artifact while the pinned matrix above
  # stays green — and MCP protocol compatibility is part of what this package promises.
  #
  # So this job resolves FREELY and on purpose, the same carve-out the `security` job makes, for
  # the same reason: the free resolution is the signal. It installs non-editably, from the built
  # tree rather than `-e .`, so what it exercises is what a user gets.
  #
  # `scripts/mcp_smoke.py` deliberately imports nothing from this repository — no pytest, no
  # `src/` on the path — so it cannot accidentally test the working tree instead of the install.
  mcp-extra:
    name: "[mcp] extra, freely resolved"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Install as a user does (unpinned on purpose)
        run: pip install ".[mcp]"
      - name: Report what the range resolved to
        run: pip show mcp | grep -i '^version' || true
      - name: MCP stdio smoke against the installed package
        run: python scripts/mcp_smoke.py --verbose
